name: ci

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  DOTNET_VERSION: '10.0.x'

jobs:
  # ---------- build + testes (todo push, qualquer branch) ----------
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read                         # restore do Fcg.Contracts exige token (feed NuGet não é anônimo)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # autentica o source github-fcg sem mutar o nuget.config versionado:
      # a credencial vai numa cópia em RUNNER_TEMP (fora da árvore), nunca no fonte rastreado
      - name: Restore autenticado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp nuget.config "$RUNNER_TEMP/nuget.config"
          dotnet nuget update source github-fcg \
            --username ${{ github.actor }} \
            --password "$GH_TOKEN" \
            --store-password-in-clear-text \
            --configfile "$RUNNER_TEMP/nuget.config"
          dotnet restore --configfile "$RUNNER_TEMP/nuget.config"
      - run: dotnet build --no-restore -c Release
      # Testcontainers usa o Docker já presente no runner para subir PostgreSQL + RabbitMQ
      - run: |
          dotnet test --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.opencover.xml

  # ---------- análise de qualidade (reaproveita a cobertura dos testes) ----------
  sonar:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read                         # restore do Fcg.Contracts exige token (feed NuGet não é anônimo)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # análise usa git blame para identificar código novo
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # mesma credencial fora da árvore: o nuget.config versionado fica intacto durante a análise
      - name: Restore autenticado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp nuget.config "$RUNNER_TEMP/nuget.config"
          dotnet nuget update source github-fcg \
            --username ${{ github.actor }} \
            --password "$GH_TOKEN" \
            --store-password-in-clear-text \
            --configfile "$RUNNER_TEMP/nuget.config"
          dotnet restore --configfile "$RUNNER_TEMP/nuget.config"
      # baixa a cobertura gerada no job test, sem re-executar os testes
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: TestResults
      - run: dotnet tool install --global dotnet-sonarscanner
      - name: Iniciar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"reinaldogez_fcg-payments" \
            /o:"reinaldogez" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs" \
            /d:sonar.exclusions="**/obj/**,**/bin/**"
      - run: dotnet build --no-restore --no-incremental -c Release
      - name: Finalizar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # ---------- publish da imagem (só na main, após os testes) ----------
  cd:
    name: CD
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/cd.yml
